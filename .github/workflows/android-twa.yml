name: Build Android TWA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed HTTPS URL of the PWA"
        required: false
        default: https://portfoliohub-pi.vercel.app
      version_name:
        description: "Release version name (example: 1.0.3)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Android version code override"
        required: false
        default: "1"
      prerelease:
        description: "Mark GitHub Release as pre-release"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PWA_APP_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.app_url || 'https://portfoliohub-pi.vercel.app' }}
      ANDROID_APP_PACKAGE_ID: ${{ vars.ANDROID_APP_PACKAGE_ID }}
      ANDROID_APP_NAME: ${{ vars.ANDROID_APP_NAME || 'PortfolioHub' }}
      ANDROID_LAUNCHER_NAME: ${{ vars.ANDROID_LAUNCHER_NAME || 'PortfolioHub' }}
      ANDROID_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '1' }}
      ANDROID_APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || github.ref_name }}
      HAS_SIGNING_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ inputs.version_name }}"
            PRE_RELEASE="${{ inputs.prerelease }}"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            PRE_RELEASE="false"
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PRE_RELEASE=$PRE_RELEASE" >> "$GITHUB_ENV"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Decode Android keystore
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android-twa/android-keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-twa/android-keystore/upload-keystore.jks

      - name: Generate TWA project
        run: node scripts/generate-twa-project.mjs

      - name: Build signed APK
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        working-directory: android-twa
        run: bubblewrap build

      - name: Build unsigned debug APK
        if: ${{ env.HAS_SIGNING_SECRETS != 'true' }}
        working-directory: android-twa
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Extract signing fingerprint
        id: fingerprint
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        run: |
          SHA256=$(keytool -list -v -keystore android-twa/android-keystore/upload-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: //')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate assetlinks artifact
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          ANDROID_SHA256_FINGERPRINTS: ${{ steps.fingerprint.outputs.sha256 }}
        run: node scripts/generate-assetlinks.mjs

      - name: Upload signed Android artifacts
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfoliohub-android-${{ env.RELEASE_VERSION }}
          path: |
            android-twa/app-release-signed.apk
            android-twa/assetlinks.generated.json
            android-twa/twa-manifest.json

      - name: Upload unsigned debug APK artifact
        if: ${{ env.HAS_SIGNING_SECRETS != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: portfoliohub-android-debug-${{ env.RELEASE_VERSION }}
          path: |
            android-twa/app/build/outputs/apk/debug/app-debug.apk
            android-twa/twa-manifest.json

      - name: Create GitHub release with signed APK
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PortfolioHub Android ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: ${{ env.PRE_RELEASE == 'true' }}
          body: |
            Android APK build generated from PortfolioHub PWA.

            - App URL: ${{ env.PWA_APP_URL }}
            - Version: ${{ env.RELEASE_VERSION }}
            - Version code: ${{ env.ANDROID_VERSION_CODE }}
            - SHA-256 signing fingerprint: ${{ steps.fingerprint.outputs.sha256 }}
          files: |
            android-twa/app-release-signed.apk
            android-twa/assetlinks.generated.json
            android-twa/twa-manifest.json

      - name: Create GitHub release with unsigned debug APK
        if: ${{ env.HAS_SIGNING_SECRETS != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PortfolioHub Android ${{ env.RELEASE_VERSION }} (Unsigned Debug)
          draft: false
          prerelease: true
          body: |
            Unsigned debug Android APK generated from PortfolioHub PWA.

            - App URL: ${{ env.PWA_APP_URL }}
            - Version: ${{ env.RELEASE_VERSION }}
            - Version code: ${{ env.ANDROID_VERSION_CODE }}
            - Signing secrets were not configured, so this is a debug/unsigned build.
          files: |
            android-twa/app/build/outputs/apk/debug/app-debug.apk
            android-twa/twa-manifest.json